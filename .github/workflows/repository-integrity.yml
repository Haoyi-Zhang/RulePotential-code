name: Repository integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '34'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate supplied materials and source/configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p069-material-integrity"
          ulimit -v 3670016
          ulimit -t 60
          timeout --signal=TERM --kill-after=5s 2m python -B .github/scripts/check_repository.py >"$RUNNER_TEMP/p069-material-integrity/stdout.txt" 2>"$RUNNER_TEMP/p069-material-integrity/stderr.txt"
      - name: Upload raw integrity output, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p069-material-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p069-material-integrity/
          if-no-files-found: warn
          retention-days: 14
